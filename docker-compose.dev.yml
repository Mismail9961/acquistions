# Local development: API + Neon Local proxy (ephemeral Neon branches by default).
# https://neon.com/docs/local/neon-local
#
# Copy .env.development.example → .env.development and fill NEON_API_KEY, NEON_PROJECT_ID, DATABASE_URL.
# Start: docker compose -f docker-compose.dev.yml up --build

services:
  neon-local:
    image: neondatabase/neon_local:latest
    env_file:
      - .env.development
    ports:
      - '${NEON_LOCAL_HOST_PORT:-5432}:5432'
    # NEON_API_KEY, NEON_PROJECT_ID, optional PARENT_BRANCH_ID / BRANCH_ID: set in .env.development

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file:
      - .env.development
    environment:
      NEON_LOCAL: 'true'
      NEON_LOCAL_HOST: neon-local
    depends_on:
      - neon-local
    volumes:
      - ./src:/app/src
